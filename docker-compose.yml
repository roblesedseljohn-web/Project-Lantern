services:
  php:
    build: .
    container_name: lantern-php
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_NAME: lantern
      DB_USER: lanternuser
      DB_PASSWORD: ${LANTERN_DB_PASSWORD:?Set LANTERN_DB_PASSWORD in .env}
    volumes:
      - ./app:/var/www/html
      - lantern_v2_files:/var/www/lantern-storage
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: lantern-db
    environment:
      MARIADB_ROOT_PASSWORD: ${LANTERN_ROOT_PASSWORD:?Set LANTERN_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: lantern
      MARIADB_USER: lanternuser
      MARIADB_PASSWORD: ${LANTERN_DB_PASSWORD:?Set LANTERN_DB_PASSWORD in .env}
    volumes:
      - lantern_v2_db:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lantern-phpmyadmin
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mariadb
    depends_on:
      - mariadb
    restart: "no"

volumes:
  lantern_v2_db:
  lantern_v2_files:
